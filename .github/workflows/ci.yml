name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same hash-locked install as the Windows launcher: a tampered package fails the build.
      - name: Install dependencies (hash-checked)
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      # Models are pinned to an upstream commit and checked against SHA-256 before use.
      - name: Download and verify face models
        run: python -c "from lensit.faces import download_models; download_models()"

      - name: Lint
        run: python -m pyflakes lensit tests run_app.py

      - name: Test
        run: python -m pytest -q tests
